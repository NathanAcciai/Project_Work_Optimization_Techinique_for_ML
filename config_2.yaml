

model_name: ["ViT-Large", "convnext_large"]
optimizer_name: ["adam", "sgd", "adamw", "lion", "adam-mini", "adafactor"]

# --- pesi pretrained da caricare via timm ---
pretrained_weights:
  convnext_large: "convnext_large"
  vit_large: "vit_large_patch16_224"  
  pretrained: true
  num_classes: 200

hyperparametres_general:
  batch_size: [256]
  epochs: 100                
  scheduler: cosine
  warmup: linear
  warmup_epochs: 5            
  T_max: 100
  eta_min: !!float 1e-6

datasets:
  tiny_imagenet:
    num_classes: 200
    img_size: 64
    patience_convnext: 10      # ridotta, meno epoche totali
    patience_vit: 15

vit_specific:
  label_smoothing: 0.1
  patch_size: 16              
  warmup_epochs: 5
  warmup_type: linear
  drop_path_rate: 0.1          

# #####################################################################
# SGD
# #####################################################################
sgd:
  convnext:
    lr: !!float 1e-3            # da 1e-2 -> 1e-3
    momentum: 0.9
    nesterov: true
    weight_decay: !!float 1e-2
  vit:
    lr: !!float 5e-4            # da 5e-3 -> 5e-4
    momentum: 0.9
    nesterov: true
    weight_decay: !!float 1e-4

# #####################################################################
# Adam
# #####################################################################
adam:
  convnext:
    lr: !!float 1e-4            # da 1e-3 -> 1e-4
    betas: [0.9, 0.999]
    eps: !!float 1e-8
    weight_decay: 0.0
  vit:
    lr: !!float 5e-5            # da 5e-4 -> 5e-5
    betas: [0.9, 0.999]
    eps: !!float 1e-8
    weight_decay: 0.0

# #####################################################################
# AdamW
# #####################################################################
adamw:
  convnext:
    lr: !!float 1e-4            # da 1e-3 -> 1e-4
    betas: [0.9, 0.999]
    eps: !!float 1e-8
    weight_decay: !!float 0.05
  vit:
    lr: !!float 5e-5            # da 5e-4 -> 5e-5
    betas: [0.9, 0.999]
    eps: !!float 1e-8
    weight_decay: !!float 0.05

# #####################################################################
# Adafactor
# #####################################################################
adafactor:
  convnext:
    lr: !!float 1e-4            # da 1e-3 -> 1e-4
    beta1: 0.9
    decay_rate: -0.8
    eps: [!!float 1e-30, !!float 1e-3]
    relative_step: false
    scale_parameter: false
    weight_decay: !!float 1e-2
  vit:
    lr: !!float 5e-5            # da 5e-4 -> 5e-5
    beta1: 0.9
    decay_rate: -0.8
    eps: [!!float 1e-30, !!float 1e-3]
    relative_step: false
    scale_parameter: false
    weight_decay: !!float 1e-2

# #####################################################################
# Lion
# #####################################################################
lion:
  convnext:
    lr: !!float 1e-5             # da 1e-4 -> 1e-5 
    betas: [0.9, 0.99]
    weight_decay: !!float 0.1
  vit:
    lr: !!float 5e-6             # da 5e-5 -> 5e-6
    betas: [0.9, 0.99]
    weight_decay: !!float 0.1

# #####################################################################
# Adam-mini
# #####################################################################
adam-mini:
  convnext:
    lr: !!float 1e-4             # da 1e-3 -> 1e-4
    betas: [0.9, 0.999]
    eps: !!float 1e-8
    weight_decay: !!float 0.05
    n_heads: 1
    n_kv_heads: 1
  vit:
    lr: !!float 5e-5             # da 5e-4 -> 5e-5
    betas: [0.9, 0.999]
    eps: !!float 1e-8
    weight_decay: !!float 0.05
    n_heads: 16                  # heads reali di ViT-Large/16
    n_kv_heads: 16